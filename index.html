<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#121217">
  <title>osu!taiko mami viewer</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="app-shell">
    <header class="appbar">
      <div class="brand-block">
        <span class="brand-kicker">TAIKO SECTION VIEWER</span>
        <h1>mami viewer</h1>
      </div>
      <span id="statusBadge" class="status-badge">OSZ未読込</span>
    </header>

    <section class="source-panel panel">
      <div class="source-row">
        <label class="file-button" for="oszInput">OSZを開く</label>
        <!-- iOS Filesで未知拡張子.oszが選択不可になるため accept は指定せず、JS側で拡張子判定する。 -->
        <input id="oszInput" type="file" hidden>
        <p id="fileName" class="file-name">.osz / .OSZ</p>
      </div>

      <label class="difficulty-field">
        <span class="label">DIFFICULTY</span>
        <select id="difficultySelect" disabled>
          <option>OSZを読み込んでください</option>
        </select>
      </label>

      <div class="song-line">
        <strong id="songTitle">—</strong>
        <span id="songMeta">—</span>
      </div>
    </section>

    <section class="editor-panel panel" aria-label="再生・ヒットポイント確認">
      <div class="position-bar">
        <div class="position-block">
          <span class="label">POSITION</span>
          <button id="copyTimeButton" class="time-copy" type="button" disabled aria-label="現在時刻をコピー">
            <span id="timeDisplay">00:00:000</span>
          </button>
        </div>
        <div class="position-side">
          <span id="kiaiBadge" class="kiai-badge">KIAI OFF</span>
          <span id="durationDisplay" class="duration">00:00:000</span>
        </div>
      </div>

      <div class="transport-row" aria-label="再生操作">
        <button id="prevHitButton" class="transport-button hit-jump" type="button" disabled aria-label="前のヒットポイント">‹ HIT</button>
        <button id="backButton" class="transport-button" type="button" disabled aria-label="5秒戻る">−5s</button>
        <button id="playButton" class="play-button" type="button" disabled aria-label="再生">▶</button>
        <button id="forwardButton" class="transport-button" type="button" disabled aria-label="5秒進む">+5s</button>
        <button id="nextHitButton" class="transport-button hit-jump" type="button" disabled aria-label="次のヒットポイント">HIT ›</button>
      </div>

      <input id="seekBar" class="seek-bar" type="range" min="0" max="1" step="0.001" value="0" disabled aria-label="曲全体の再生位置">
      <audio id="audio" preload="metadata"></audio>

      <div class="mark-strip" aria-label="使用区間記録">
        <span class="mark-label">RANGE</span>
        <button id="startMarkButton" class="mark-button start" type="button" disabled>START</button>
        <button id="endMarkButton" class="mark-button end" type="button" disabled>END</button>
        <button id="clearRangeButton" class="clear-button" type="button" disabled>CLR</button>
      </div>

      <div class="timeline-toolbar">
        <div class="timeline-title">
          <span class="label">OBJECT TIMELINE</span>
          <span id="zoomLabel" class="zoom-label">±3.0s</span>
        </div>
        <div class="zoom-controls" aria-label="タイムライン拡大縮小">
          <button id="zoomOutButton" type="button" disabled aria-label="タイムラインを縮小">−</button>
          <button id="zoomInButton" type="button" disabled aria-label="タイムラインを拡大">＋</button>
        </div>
      </div>

      <canvas id="timelineCanvas" aria-label="現在位置周辺のTaikoヒットポイント"></canvas>

      <div class="overview-head">
        <span class="label">SONG TIMELINE</span>
        <span class="overview-note">Kiai / Range / Position</span>
      </div>
      <canvas id="overviewCanvas" aria-label="曲全体のKiaiと選択区間"></canvas>
    </section>

    <section class="output-panel panel">
      <div class="output-head">
        <div>
          <span class="label">EXPORT</span>
          <strong>区間情報</strong>
        </div>
        <button id="copyOutputButton" class="copy-button" type="button" disabled>COPY</button>
      </div>

      <div class="output-controls">
        <label>
          <span class="label">用途</span>
          <select id="purposeSelect">
            <option value="">選択してください</option>
            <option value="Stream">Stream</option>
            <option value="Normal">Normal</option>
            <option value="1/6">1/6</option>
            <option value="DoubleBPM">DoubleBPM</option>
          </select>
        </label>
        <label>
          <span class="label">Fade-in/out</span>
          <select id="fadeSelect">
            <option value="含まない" selected>含まない</option>
            <option value="含む">含む</option>
          </select>
        </label>
      </div>

      <pre id="outputPreview" class="output-preview">**曲名：—**
用途：—
難易度：**—**
区間：—（Fade-in/out：含まない）</pre>
    </section>

    <section class="error-panel panel" id="errorCard" hidden>
      <strong>読み込みエラー</strong>
      <p id="errorMessage"></p>
    </section>
  </main>

  <script src="./vendor/jszip.min.js"></script>
  <script src="./app.js"></script>
</body>
</html>
