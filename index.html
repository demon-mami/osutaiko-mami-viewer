<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0e11">
  <title>osu!taiko mami viewer</title>
  <link rel="stylesheet" href="./style.css?v=20260811-0015">
  <link rel="stylesheet" href="./theme-black-rose.css?v=1.3">
  <link rel="stylesheet" href="./workflow-tools.css?v=20260811-0840">
</head>
<body>
  <main class="app-shell">
    <header class="appbar">
      <div class="brand-block"><span class="brand-kicker">demon mami's</span><h1>Taiko Section Viewer</h1></div>
    </header>

    <section class="source-panel panel">
      <div class="source-row native-file-row">
        <div class="native-file-wrap"><input id="oszInput" class="native-file-input" type="file"></div>
        <p id="fileName" class="file-name"></p>
      </div>
      <label class="difficulty-field"><select id="difficultySelect" disabled><option>OSZを読み込んでください</option></select></label>
      <div class="song-line"><strong id="songTitle">—</strong><span id="songMeta">—</span></div>
    </section>

    <section class="editor-panel panel" aria-label="再生・ヒットポイント確認">
      <div id="timelineViewport" class="timeline-viewport" aria-label="現在位置周辺のTaikoヒットポイント">
        <canvas id="timelineStaticCanvas" class="timeline-static"></canvas><canvas id="timelineCursorCanvas" class="timeline-cursor"></canvas>
      </div>

      <div id="overviewViewport" class="overview-viewport" aria-label="曲全体のKiai・BPM・ノーツ密度・現在位置">
        <canvas id="overviewStaticCanvas" class="overview-static"></canvas><canvas id="overviewCursorCanvas" class="overview-cursor"></canvas>
        <button id="copyTimeButton" class="song-time-copy" type="button" disabled aria-label="現在時刻をコピー"><span id="timeDisplay">00:00:000</span></button>
      </div>
      <input id="seekBar" class="seek-bar" type="range" min="0" max="1" step="0.001" value="0" disabled aria-label="曲全体の再生位置">

      <div class="editor-control-grid" aria-label="区間・再生・ズーム操作">
        <div class="range-inline" aria-label="使用区間">
          <button id="startMarkButton" class="mark-button start" type="button" disabled>START</button>
          <button id="endMarkButton" class="mark-button end" type="button" disabled>END</button>
        </div>
        <div class="range-length-box"><strong id="rangeLength">—</strong></div>

        <div class="transport-row" aria-label="再生操作">
          <button id="backButton" class="transport-button" type="button" disabled>−5s</button>
          <button id="playButton" class="play-button" type="button" disabled>▶</button>
          <button id="forwardButton" class="transport-button" type="button" disabled>+5s</button>
        </div>
        <div class="zoom-controls compact-zoom" aria-label="タイムライン拡大縮小">
          <button id="zoomOutButton" type="button" disabled aria-label="タイムラインを縮小">−</button>
          <span id="zoomLabel" class="zoom-label">±0.5s</span>
          <button id="zoomInButton" type="button" disabled aria-label="タイムラインを拡大">＋</button>
        </div>
      </div>
    </section>

    <section class="output-panel panel">
      <div class="output-head copy-parking"><button id="copyOutputButton" class="copy-button" type="button" disabled>Copy</button></div>
      <div class="output-controls">
        <label><span class="label">Type</span><select id="purposeSelect"><option value="">選択してください</option><option value="Stream">Stream</option><option value="Normal">Normal</option><option value="1/6">1/6</option><option value="DoubleBPM">DoubleBPM</option></select></label>
        <label><span class="label">Fade-in/out</span><select id="fadeSelect"><option value="含まない" selected>含まない</option><option value="含む">含む</option></select></label>
      </div>
      <pre id="outputPreview" class="output-preview">**曲名：—**
Type：—
難易度：**—**
区間：—（Fade-in/out：含まない）</pre>
    </section>

    <pre id="audioDebug" hidden></pre>
    <section class="error-panel panel" id="errorCard" hidden><strong>読み込みエラー</strong><p id="errorMessage"></p></section>
  </main>
  <script src="./vendor/jszip.min.js?v=3.10.1"></script>
  <script src="./app-v4.js?v=20260811-0015"></script>
  <script src="./ui-refine.js?v=20260811-0015"></script>
  <script src="./workflow-tools.js?v=20260811-0837"></script>
  <script src="./action-layout.js?v=20260811-0840"></script>
  <script src="./object-timeline-v2.js?v=20260811-0824"></script>
  <script src="./completed-list.js?v=20260811-0341"></script>
</body>
</html>
