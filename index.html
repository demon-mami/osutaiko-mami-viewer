<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111318">
  <title>osu!taiko mami viewer</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">osu!taiko / mobile</p>
        <h1>osu!taiko mami viewer</h1>
      </div>
      <div id="statusBadge" class="status-badge">OSZ未読込</div>
    </header>

    <section class="card file-card">
      <label class="file-button" for="oszInput">OSZを選択</label>
      <!-- acceptを付けない。iOS Filesで未知拡張子.oszが選択不可になるのを避け、JS側で拡張子検証する。 -->
      <input id="oszInput" type="file" hidden>
      <p id="fileName" class="muted">.osz / .OSZ を選択できます。ファイルは端末内だけで解析します。</p>
    </section>

    <section class="card" id="mapSection" aria-disabled="true">
      <label class="field-label" for="difficultySelect">難易度</label>
      <select id="difficultySelect" disabled>
        <option>OSZを読み込んでください</option>
      </select>
      <div class="song-info">
        <strong id="songTitle">—</strong>
        <span id="songMeta">—</span>
      </div>
    </section>

    <section class="card player-card">
      <div class="time-row">
        <div>
          <span class="field-label">現在位置</span>
          <div id="timeDisplay" class="time-display">00:00:000</div>
        </div>
        <button id="copyTimeButton" class="ghost-button" type="button" disabled>時刻コピー</button>
      </div>

      <div class="range-compact" aria-label="使用区間記録">
        <span class="range-compact-label">区間</span>
        <button id="startMarkButton" class="mark-button start" type="button" disabled>START</button>
        <button id="endMarkButton" class="mark-button end" type="button" disabled>END</button>
        <button id="clearRangeButton" class="clear-button" type="button" disabled>解除</button>
      </div>

      <div class="transport-row">
        <button id="backButton" class="round-button" type="button" disabled aria-label="5秒戻る">−5</button>
        <button id="playButton" class="play-button" type="button" disabled aria-label="再生">▶</button>
        <button id="forwardButton" class="round-button" type="button" disabled aria-label="5秒進む">+5</button>
      </div>

      <input id="seekBar" class="seek-bar" type="range" min="0" max="1" step="0.001" value="0" disabled aria-label="曲位置">
      <div class="seek-labels">
        <span>00:00:000</span>
        <span id="durationDisplay">00:00:000</span>
      </div>
      <audio id="audio" preload="metadata"></audio>
    </section>

    <section class="card timeline-card">
      <div class="timeline-heading">
        <span class="field-label">ヒットポイント</span>
        <span id="kiaiBadge" class="kiai-badge">KIAI OFF</span>
      </div>
      <canvas id="timelineCanvas" aria-label="現在位置付近のヒットポイント"></canvas>

      <div class="overview-inline">
        <span class="field-label">全体ビュー</span>
        <canvas id="overviewCanvas" aria-label="曲全体のKiai位置"></canvas>
      </div>
    </section>

    <section class="card output-card">
      <div class="section-heading output-heading">
        <div>
          <span class="field-label">コピー用出力</span>
          <strong>用途とFade-in/outを選択</strong>
        </div>
      </div>

      <div class="output-controls">
        <label>
          <span class="field-label">用途</span>
          <select id="purposeSelect">
            <option value="">選択してください</option>
            <option value="Stream">Stream</option>
            <option value="Normal">Normal</option>
            <option value="1/6">1/6</option>
            <option value="DoubleBPM">DoubleBPM</option>
          </select>
        </label>
        <label>
          <span class="field-label">Fade-in/out</span>
          <select id="fadeSelect">
            <option value="含まない" selected>含まない</option>
            <option value="含む">含む</option>
          </select>
        </label>
      </div>

      <pre id="outputPreview" class="output-preview">**曲名：—**
用途：—
難易度：**—**
区間：—（Fade-in/out：含まない）</pre>
      <button id="copyOutputButton" class="copy-primary" type="button" disabled>COPY</button>
    </section>

    <section class="card error-card" id="errorCard" hidden>
      <strong>読み込みエラー</strong>
      <p id="errorMessage"></p>
    </section>
  </main>

  <script src="./vendor/jszip.min.js"></script>
  <script src="./app.js"></script>
</body>
</html>
